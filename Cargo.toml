[package]
name = "faker-rs"
version = "0.2.1"
edition = "2021"
description = "A high-performance, drop-in replacement for Python's Faker library, backed by Rust and PyO3."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/harrisonclough99/faker-rs"
keywords = ["faker", "fake-data", "pyo3", "python", "testing"]
categories = ["development-tools::testing"]

[lib]
name = "_faker_rs"
crate-type = ["cdylib"]

[dependencies]
fastrand = "2.3"
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
